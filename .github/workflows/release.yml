name: Release

on:
  push:
    tags: ['v*']

  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create resource directories
        run: |
          mkdir -p resources/stt-server/build
          mkdir -p resources/tts-server/build

      - name: Build STT binary
        run: |
          pip install pyinstaller --quiet
          pip install -r requirements.txt --quiet
          pyinstaller \
            --onefile \
            --name stt-server \
            --distpath resources/stt-server \
            --workpath resources/stt-server/build \
            --specpath resources/stt-server \
            --hidden-import=fastapi \
            --hidden-import=uvicorn \
            --hidden-import=uvicorn.logging \
            --hidden-import=uvicorn.protocols \
            --hidden-import=uvicorn.protocols.http \
            --hidden-import=uvicorn.protocols.http.auto \
            --hidden-import=uvicorn.lifespan \
            --hidden-import=uvicorn.lifespan.server \
            --hidden-import=httpx \
            --hidden-import=speechbrain \
            --hidden-import=speechbrain.inference \
            --hidden-import=speechbrain.inference.encoders \
            --hidden-import=speechbrain.models \
            --hidden-import=silero_vad \
            --hidden-import=torch \
            --hidden-import=numpy \
            src/stt/server.py
        shell: bash

      - name: Build TTS binary
        run: |
          pip install pyinstaller --quiet
          pip install -r requirements.txt --quiet
          pyinstaller \
            --onefile \
            --name tts-server \
            --distpath resources/tts-server \
            --workpath resources/tts-server/build \
            --specpath resources/tts-server \
            --hidden-import=fastapi \
            --hidden-import=uvicorn \
            --hidden-import=uvicorn.logging \
            --hidden-import=uvicorn.protocols \
            --hidden-import=uvicorn.protocols.http \
            --hidden-import=uvicorn.protocols.http.auto \
            --hidden-import=uvicorn.lifespan \
            --hidden-import=uvicorn.lifespan.server \
            --hidden-import=httpx \
            --hidden-import=websockets \
            --hidden-import=websockets.client \
            --hidden-import=websockets.server \
            --hidden-import=piper \
            --hidden-import=numpy \
            --collect-all=piper \
            src/tts/server.py
        shell: bash

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run tests before release
        run: |
          npm test
          source .venv/bin/activate || true
          pytest tests/python/ --cov=src || true

      - name: Build frontend
        run: npm run build

      - name: Build Electron app (Linux)
        run: npx electron-builder --linux --publish never

      - name: Build Electron app (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never

      - name: Build Electron app (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --publish never

      - name: Upload Linux AppImage
        if: runner.os == 'Linux'
        uses: softprops/action-gh-release@v3
        with:
          files: release/Vertha-*.AppImage
          draft: false
          generate_release_notes: true

      - name: Upload Windows exe
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v3
        with:
          files: release/*.exe
          draft: false

      - name: Upload macOS dmg
        if: runner.os == 'macOS'
        uses: softprops/action-gh-release@v3
        with:
          files: release/*.dmg
          draft: false
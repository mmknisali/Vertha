name: CI

on:
  push:
    branches: [main, develop, 'tab/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'
  # The Electron binary is large and is not needed to run the unit tests.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  lint:
    name: Lint (Python syntax and undefined names)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: python -m pip install ruff

      # Only the checks that find real errors: syntax errors, undefined names,
      # bad imports. Style is not enforced. The repo has no JavaScript linter
      # configured; the build job parses every JS and JSX file.
      - name: Run ruff (error-level rules)
        run: ruff check --select E9,F63,F7,F82 --output-format=github src/tts src/stt tests/python

  test-frontend:
    name: Frontend tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest tests
        run: npm test

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: frontend-coverage
        continue-on-error: true

  test-python:
    name: Server tests without ML packages (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tests/python/requirements-ci.txt

      - name: Install test dependencies
        run: python -m pip install -r tests/python/requirements-ci.txt

      - name: Run pytest (no ML packages)
        run: python -m pytest tests/python --ignore=tests/python/test_tts_server.py -p no:cacheprovider

  test-electron:
    name: Electron tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Electron tests
        run: npm run test:electron

  build-check:
    name: Build check
    runs-on: ubuntu-latest
    needs: [test-frontend, test-python]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html && echo "Frontend build OK"

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high || true

  test-e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: build-check
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      - name: Run E2E tests
        run: |
          npm run electron:dev &
          sleep 10
          npx playwright test || true
        shell: bash

  all-tests-pass:
    name: All required checks passed
    runs-on: ubuntu-latest
    needs: [lint, test-frontend, test-python, test-electron, build-check]
    if: always()
    steps:
      - name: Check required jobs
        run: |
          for result in "${{ needs.lint.result }}" "${{ needs.test-frontend.result }}" "${{ needs.test-python.result }}" "${{ needs.test-electron.result }}" "${{ needs.build-check.result }}"; do
            if [[ "$result" != "success" ]]; then
              echo "A required check did not pass: $result"
              exit 1
            fi
          done
          echo "All required checks passed"

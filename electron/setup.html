<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Vertha Setup</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0a0a12 0%, #1a1a2e 100%);
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: rgba(20, 20, 35, 0.9);
      border: 1px solid rgba(0, 255, 255, 0.2);
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 0 40px rgba(0, 255, 255, 0.1);
    }
    
    h1 {
      color: #00ffff;
      font-size: 24px;
      margin-bottom: 8px;
      text-align: center;
    }
    
    .subtitle {
      color: #888;
      text-align: center;
      margin-bottom: 28px;
      font-size: 14px;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    label {
      display: block;
      margin-bottom: 6px;
      color: #00ffff;
      font-size: 13px;
      font-weight: 500;
    }
    
    input {
      width: 100%;
      padding: 12px 14px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(0, 255, 255, 0.2);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    
    input:focus {
      outline: none;
      border-color: #00ffff;
      box-shadow: 0 0 12px rgba(0, 255, 255, 0.2);
    }
    
    input::placeholder {
      color: #555;
    }
    
    .hint {
      margin-top: 4px;
      font-size: 11px;
      color: #666;
    }
    
    .hint a {
      color: #00ffff;
      text-decoration: none;
    }
    
    .hint a:hover {
      text-decoration: underline;
    }
    
    .location-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #00b3b3 0%, #00ffff 100%);
      border: none;
      border-radius: 8px;
      color: #000;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    
    button:hover:not(:disabled) {
      opacity: 0.9;
    }
    
    button:active:not(:disabled) {
      transform: scale(0.98);
    }
    
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .error {
      background: rgba(255, 50, 50, 0.2);
      border: 1px solid rgba(255, 50, 50, 0.4);
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 16px;
      color: #ff6b6b;
      font-size: 13px;
      display: none;
    }
    
    .error.visible {
      display: block;
    }
    
    .progress {
      display: none;
      text-align: center;
      padding: 20px;
    }
    
    .progress.visible {
      display: block;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(0, 255, 255, 0.2);
      border-top-color: #00ffff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Vertha Setup</h1>
    <p class="subtitle">Configure your voice assistant</p>
    
    <div id="error" class="error"></div>
    
    <form id="setupForm">
      <div class="form-group">
        <label for="groqApiKey">Groq API Key *</label>
        <input type="password" id="groqApiKey" placeholder="gsk_..." required>
        <p class="hint">Required for speech-to-text. Get one at <a href="https://console.groq.com" target="_blank">console.groq.com</a></p>
      </div>
      
      <div class="form-group">
        <label for="zenApiKey">Zen API Key *</label>
        <input type="password" id="zenApiKey" placeholder="sk-..." required>
        <p class="hint">Required for AI reasoning. Get one from your Zen account.</p>
      </div>
      
      <div class="form-group">
        <label for="piperVoicePath">Piper Voice Model Path</label>
        <input type="text" id="piperVoicePath" placeholder="/path/to/voice.onnx">
        <p class="hint">Optional. Path to a custom Piper voice model (.onnx file).</p>
      </div>
      
      <div class="form-group">
        <label>Location (for weather)</label>
        <div class="location-row">
          <input type="text" id="locationLat" placeholder="Latitude" value="37.0662">
          <input type="text" id="locationLon" placeholder="Longitude" value="37.3833">
        </div>
      </div>
      
      <button type="submit" id="startBtn">Start Vertha</button>
    </form>
    
    <div id="progress" class="progress">
      <div class="spinner"></div>
      <p>Starting services...</p>
    </div>
  </div>
  
  <script src="setup.js"></script>
</body>
</html>
